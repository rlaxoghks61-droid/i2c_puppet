plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flip5.coverhelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flip5.coverhelper'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

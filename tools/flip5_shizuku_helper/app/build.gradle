plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flip5.coverhelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flip5.coverhelper'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        helper {
            storeFile file('../flip5-helper.keystore')
            storePassword 'android'
            keyAlias 'flip5helper'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.helper
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.helper
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

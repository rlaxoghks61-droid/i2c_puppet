name: Build hardware keyboard toolbar APK

on:
  workflow_dispatch:
  push:
    branches: [ "hw-keyboard-toolbar-final" ]
    paths:
      - ".github/workflows/build-hw-toolbar.yml"
      - "v11b/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore known-good project archive
        run: git show dcdb6004fee243751ae70d5e172583533dea8b35:android-toolbar.zip > android-toolbar.zip
      - name: Unpack project
        run: mkdir -p android-toolbar && unzip -q android-toolbar.zip -d android-toolbar
      - name: Apply v11 Samsung translation overrides
        run: |
          cat v11b/part*.txt > toolbar-v11-overrides.tar.gz.b64
          base64 -d toolbar-v11-overrides.tar.gz.b64 > toolbar-v11-overrides.tar.gz
          tar -xzf toolbar-v11-overrides.tar.gz -C android-toolbar
      - name: Apply v12 Samsung Notes, toggle, translation fixes
        run: |
          python3 - <<'PY2'
          from pathlib import Path

          kas = Path('android-toolbar/app/src/main/java/com/bbq20kbd/toolbar/test/KeyboardAccessibilityService.java')
          s = kas.read_text()
          s = s.replace('import android.accessibilityservice.AccessibilityService;\n',
                        'import android.accessibilityservice.AccessibilityService;\nimport android.accessibilityservice.AccessibilityServiceInfo;\nimport android.accessibilityservice.InputMethod;\n')
          s = s.replace('import android.os.Bundle;\n', 'import android.os.Build;\nimport android.os.Bundle;\n')
          s = s.replace('import android.text.TextUtils;\n', 'import android.text.TextUtils;\nimport android.util.Log;\n')
          s = s.replace('    private static KeyboardAccessibilityService instance;\n',
                        '    private static KeyboardAccessibilityService instance;\n    private InputMethod accessibilityInputMethod;\n')
          old = '    @Override\n    protected void onServiceConnected() {\n        super.onServiceConnected();\n        instance = this;\n    }\n'
          new = '''    @Override
          protected void onServiceConnected() {
              super.onServiceConnected();
              instance = this;
              if (Build.VERSION.SDK_INT >= 33) {
                  try {
                      AccessibilityServiceInfo info = getServiceInfo();
                      if (info != null && (info.flags & AccessibilityServiceInfo.FLAG_INPUT_METHOD_EDITOR) == 0) {
                          info.flags |= AccessibilityServiceInfo.FLAG_INPUT_METHOD_EDITOR;
                          setServiceInfo(info);
                      }
                  } catch (Exception e) {
                      Log.w("HWKeyboardInput", "Unable to enable accessibility IME flag", e);
                  }
              }
          }

          @Override
          public InputMethod onCreateInputMethod() {
              accessibilityInputMethod = new InputMethod(this);
              Log.i("HWKeyboardInput", "Accessibility InputMethod created");
              return accessibilityInputMethod;
          }
'''
          if old not in s: raise SystemExit('onServiceConnected block not found')
          s = s.replace(old, new, 1)
          marker = '    public boolean insertText(String insertion) {\n'
          helper = '''    private boolean commitThroughAccessibilityIme(String insertion) {
              if (Build.VERSION.SDK_INT < 33 || accessibilityInputMethod == null) return false;
              try {
                  InputMethod.AccessibilityInputConnection connection = accessibilityInputMethod.getCurrentInputConnection();
                  if (connection == null) return false;
                  connection.commitText(insertion, 1, null);
                  Log.i("HWKeyboardInput", "AccessibilityInputConnection.commitText chars=" + insertion.length());
                  return true;
              } catch (Exception e) {
                  Log.w("HWKeyboardInput", "AccessibilityInputConnection.commitText failed", e);
                  return false;
              }
          }

'''
          if marker not in s: raise SystemExit('insertText marker not found')
          s = s.replace(marker, helper + marker, 1)
          old = '    public boolean insertText(String insertion) {\n        if (insertion == null || insertion.isEmpty()) return false;\n'
          new = '    public boolean insertText(String insertion) {\n        if (insertion == null || insertion.isEmpty()) return false;\n        if (commitThroughAccessibilityIme(insertion)) return true;\n'
          if old not in s: raise SystemExit('insertText start not found')
          s = s.replace(old, new, 1)
          kas.write_text(s)

          cfg = Path('android-toolbar/app/src/main/res/xml/accessibility_service_config.xml')
          x = cfg.read_text().replace('flagReportViewIds|flagRetrieveInteractiveWindows',
                                      'flagReportViewIds|flagRetrieveInteractiveWindows|flagInputMethodEditor')
          cfg.write_text(x)

          ts = Path('android-toolbar/app/src/main/java/com/bbq20kbd/toolbar/test/ToolbarService.java')
          s = ts.read_text()
          s = s.replace('    private View panel;\n', '    private View panel;\n    private String activePanelKey;\n')
          old = ('        addToolbarClipboardButton(bar, iconColor, v -> requestClipboardPanel());\n'
                 '        addToolbarButton(bar, "😀", "이모지", iconColor, v -> showGridPanel("이모지", EMOJI));\n'
                 '        addToolbarButton(bar, "#+=", "특수문자", iconColor, v -> showGridPanel("특수문자", SYMBOLS));\n'
                 '        addToolbarButton(bar, "123", "숫자", iconColor, v -> showNumberPanel());\n'
                 '        addToolbarButton(bar, "A↔가", "삼성 번역", iconColor, v -> showSamsungTranslationPanel());\n')
          new = ('        addToolbarClipboardButton(bar, iconColor, v -> { if (preparePanel("clipboard")) requestClipboardPanel(); });\n'
                 '        addToolbarButton(bar, "😀", "이모지", iconColor, v -> { if (preparePanel("emoji")) showGridPanel("이모지", EMOJI); });\n'
                 '        addToolbarButton(bar, "#+=", "특수문자", iconColor, v -> { if (preparePanel("symbols")) showGridPanel("특수문자", SYMBOLS); });\n'
                 '        addToolbarButton(bar, "123", "숫자", iconColor, v -> { if (preparePanel("numbers")) showNumberPanel(); });\n'
                 '        addToolbarButton(bar, "A↔가", "삼성 번역", iconColor, v -> { if (preparePanel("translate")) showSamsungTranslationPanel(); });\n')
          if old not in s: raise SystemExit('toolbar button block not found')
          s = s.replace(old, new, 1)
          old = '    private void requestClipboardPanel() {\n        // 다른 팝업이 열려 있어도 툴바 버튼을 누르면 즉시 전환한다.\n        hidePanel();\n        try {\n'
          new = '''    private boolean preparePanel(String key) {
              if (panel != null && key.equals(activePanelKey)) {
                  hidePanel();
                  return false;
              }
              hidePanel();
              activePanelKey = key;
              return true;
          }

          private void requestClipboardPanel() {
              try {
'''
          if old not in s: raise SystemExit('clipboard request block not found')
          s = s.replace(old, new, 1)
          old = '    private void showClipboardPanelInternal() {\n        captureClipboardIfReadable();\n'
          new = '    private void showClipboardPanelInternal() {\n        if (!"clipboard".equals(activePanelKey)) return;\n        captureClipboardIfReadable();\n'
          s = s.replace(old, new, 1)
          old = '    private void showPanel(View content, int height) {\n        hidePanel();\n        if (windowManager == null || toolbar == null) return;\n'
          new = '    private void showPanel(View content, int height) {\n        removePanelViewOnly();\n        if (windowManager == null || toolbar == null) { activePanelKey = null; return; }\n'
          if old not in s: raise SystemExit('showPanel start not found')
          s = s.replace(old, new, 1)
          old = '    private void hidePanel() {\n        if (panel == null || windowManager == null) return;\n        try { windowManager.removeView(panel); } catch (Exception ignored) { }\n        panel = null;\n    }\n'
          new = '''    private void removePanelViewOnly() {
              if (panel == null) return;
              if (windowManager != null) {
                  try { windowManager.removeView(panel); } catch (Exception ignored) { }
              }
              panel = null;
          }

          private void hidePanel() {
              removePanelViewOnly();
              activePanelKey = null;
          }
'''
          if old not in s: raise SystemExit('hidePanel block not found')
          s = s.replace(old, new, 1)
          ts.write_text(s)

          tr = Path('android-toolbar/app/src/main/java/com/bbq20kbd/toolbar/test/SamsungTranslationClient.java')
          s = tr.read_text()
          if 'request.putBundle("speech-llm-bundle", null);' not in s: raise SystemExit('speech llm key not found')
          s = s.replace('        request.putBundle("speech-llm-bundle", null);\n', '')
          tr.write_text(s)

          b = Path('android-toolbar/app/build.gradle.kts')
          s = b.read_text().replace('versionCode = 12', 'versionCode = 13').replace('versionName = "1.8"', 'versionName = "1.9"')
          b.write_text(s)
          PY2
      - name: Build
        working-directory: android-toolbar
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HardwareKeyboardToolbar-v12-NotesTranslateToggleFix
          path: android-toolbar/app/build/outputs/apk/debug/app-debug.apk

name: Build hardware keyboard toolbar APK

on:
  workflow_dispatch:
  push:
    branches: [ "hw-keyboard-toolbar-final" ]
    paths:
      - "android-toolbar.zip"
      - ".github/workflows/build-hw-toolbar.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack project
        run: mkdir -p android-toolbar && unzip -q android-toolbar.zip -d android-toolbar
      - name: Build
        working-directory: android-toolbar
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HardwareKeyboardToolbar
          path: android-toolbar/app/build/outputs/apk/debug/app-debug.apk

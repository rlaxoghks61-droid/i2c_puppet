name: Build hardware keyboard toolbar APK

on:
  workflow_dispatch:
  push:
    branches: [ "hw-keyboard-toolbar-final" ]
    paths:
      - ".github/workflows/build-hw-toolbar.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore known-good project archive
        run: git show dcdb6004fee243751ae70d5e172583533dea8b35:android-toolbar.zip > android-toolbar.zip
      - name: Unpack project
        run: mkdir -p android-toolbar && unzip -q android-toolbar.zip -d android-toolbar
      - name: Fix Flip5 toolbar visibility gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-toolbar/app/src/main/java/com/bbq20kbd/toolbar/test/ToolbarService.java')
          s = p.read_text()
          old = 'if (!Settings.canDrawOverlays(this) || !hasExternalAlphabeticKeyboard() || !isCoverLikeDisplay()) {'
          new = 'if (!Settings.canDrawOverlays(this) || !hasExternalAlphabeticKeyboard()) {'
          if old not in s:
              raise SystemExit('visibility gate not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        working-directory: android-toolbar
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HardwareKeyboardToolbar-Fixed
          path: android-toolbar/app/build/outputs/apk/debug/app-debug.apk

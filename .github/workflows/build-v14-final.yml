name: Build Hardware Keyboard Toolbar v14 final

on:
  workflow_dispatch:
  push:
    branches: [ "hw-keyboard-toolbar-final" ]
    paths:
      - ".github/workflows/build-v14-final.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore v13 project
        run: |
          cat v13b/part*.txt > toolbar-v13-project.tar.gz.b64
          base64 -d toolbar-v13-project.tar.gz.b64 > toolbar-v13-project.tar.gz
          mkdir -p android-toolbar-v14
          tar -xzf toolbar-v13-project.tar.gz -C android-toolbar-v14
      - name: Apply v14 final patch
        run: |
          echo '' | base64 -d > /tmp/patch_v14.py
          python3 /tmp/patch_v14.py
      - name: Build
        working-directory: android-toolbar-v14
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HardwareKeyboardToolbar-v14-SystemClipboardScreenshot
          path: android-toolbar-v14/app/build/outputs/apk/debug/app-debug.apk

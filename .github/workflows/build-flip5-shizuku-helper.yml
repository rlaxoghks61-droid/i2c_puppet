name: Build Flip5 Shizuku Helper

on:
  push:
    branches:
      - flip5-shizuku-helper-build
    paths:
      - 'tools/flip5_shizuku_helper/**'
      - '.github/workflows/build-flip5-shizuku-helper.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        working-directory: tools/flip5_shizuku_helper
        run: base64 -d flip5-helper.keystore.b64 > flip5-helper.keystore

      - name: Build APK
        working-directory: tools/flip5_shizuku_helper
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flip5CoverHelper-Shizuku-v1.0
          path: tools/flip5_shizuku_helper/app/build/outputs/apk/release/app-release.apk

name: Build Hardware Keyboard Toolbar v19 Gesture Dismiss

on:
  workflow_dispatch:
  push:
    branches: [ "hw-keyboard-toolbar-final" ]
    paths:
      - ".github/workflows/build-v19-gesture-dismiss.yml"
      - "v19patch/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore v13 project
        run: |
          cat v13b/part*.txt > toolbar-v13-project.tar.gz.b64
          base64 -d toolbar-v13-project.tar.gz.b64 > toolbar-v13-project.tar.gz
          mkdir -p android-toolbar-v14
          tar -xzf toolbar-v13-project.tar.gz -C android-toolbar-v14
      - name: Reapply v14 base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          s = Path('.github/workflows/build-v14-final.yml').read_text()
          m = re.search(r"echo '([^']+)' \| base64 -d > /tmp/patch_v14\.py", s)
          if not m:
              raise SystemExit('v14 patch payload not found')
          Path('/tmp/patch_v14.py').write_bytes(base64.b64decode(m.group(1)))
          PY
          python3 /tmp/patch_v14.py
      - name: Reapply v15 auto screenshot base
        run: |
          cat v15patch/part*.txt | base64 -d > /tmp/patch_v15.py
          python3 /tmp/patch_v15.py
      - name: Reapply v16 popup and clipboard fix
        working-directory: android-toolbar-v14
        run: patch -p1 < ../v16patch/toolbar-v16.patch
      - name: Reapply v17 fixed bottom and UI cleanup
        working-directory: android-toolbar-v14
        run: |
          patch -p1 < ../v17patch/toolbar-v17.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/bbq20kbd/toolbar/test/MainActivity.java')
          s = p.read_text()
          pattern = r'TextView info = new TextView\(this\);\n.*?info\.setTextColor\(Color\.DKGRAY\);'
          replacement = 'TextView info = new TextView(this);\n        info.setText("외장 하드웨어 키보드가 연결된 커버 화면에서 자동으로 표시됩니다.\\n\\n" +\n                "오버레이 권한은 툴바 표시용이고, 접근성 권한은 툴바 입력용입니다.");\n        info.setTextColor(Color.DKGRAY);'
          s2, n = re.subn(pattern, lambda m: replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('MainActivity info block not found')
          p.write_text(s2)
          PY
      - name: Reapply v18 clipboard icon fix
        working-directory: android-toolbar-v14
        run: patch -p1 < ../v18patch/toolbar-v18.patch
      - name: Apply v19 gesture dismiss and plain clipboard icon
        working-directory: android-toolbar-v14
        run: patch -p1 < ../v19patch/toolbar-v19.patch
      - name: Build
        working-directory: android-toolbar-v14
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HardwareKeyboardToolbar-v19-GestureDismiss
          path: android-toolbar-v14/app/build/outputs/apk/debug/app-debug.apk

name: Build HW Keyboard Toolbar Test

on:
  push:
    branches:
      - build/hw-keyboard-toolbar-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p android-toolbar-test :app:assembleDebug --stacktrace

      - name: Collect APK
        run: cp android-toolbar-test/app/build/outputs/apk/debug/app-debug.apk HWKeyboardToolbarTest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HWKeyboardToolbarTest
          path: HWKeyboardToolbarTest.apk

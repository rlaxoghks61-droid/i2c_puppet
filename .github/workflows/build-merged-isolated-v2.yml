name: Build merged isolated CoverRecents + Toolbar v2

on:
  workflow_dispatch:
  push:
    branches: [ "coverrecents-toolbar-isolated-v2" ]
    paths:
      - ".github/workflows/build-merged-isolated-v2.yml"
      - "mergedisolatedv2/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore previous merged source
        run: |
          cat mergedcovertoolbar/part00.txt mergedcovertoolbar/part01.txt mergedcovertoolbar/part02.txt mergedcovertoolbar/part03.txt mergedcovertoolbar/part04.txt > /tmp/merged-source.b64
          test "$(wc -c < /tmp/merged-source.b64)" = "44988"
          echo '8cac4a2fa515706964ad95c83bdbeec3fa4944b5a6042167890bea96d02eb4aa  /tmp/merged-source.b64' | sha256sum -c -
          base64 -d /tmp/merged-source.b64 > /tmp/merged-source.tar.xz
          echo '8912a97f4fdcf03ed2c7dfb5a8aa795988dced5abb7dea6dfb8192347981e64f  /tmp/merged-source.tar.xz' | sha256sum -c -
          xz -t /tmp/merged-source.tar.xz
          tar -xJf /tmp/merged-source.tar.xz

      - name: Isolate toolbar from CoverRecents
        run: python3 mergedisolatedv2/apply_isolation.py

      - name: Build isolated merged APK
        working-directory: merged_project
        run: gradle :app:assembleDebug

      - name: Package source
        run: zip -qr CoverRecents-HardwareToolbar-Isolated-v2-source.zip merged_project

      - uses: actions/upload-artifact@v4
        with:
          name: CoverRecents-HardwareToolbar-Isolated-v2
          path: |
            merged_project/app/build/outputs/apk/debug/app-debug.apk
            CoverRecents-HardwareToolbar-Isolated-v2-source.zip

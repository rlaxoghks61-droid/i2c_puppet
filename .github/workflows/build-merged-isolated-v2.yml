name: Build merged isolated CoverRecents + Toolbar v2

on:
  workflow_dispatch:
  push:
    branches: [ "coverrecents-toolbar-isolated-v2" ]
    paths:
      - ".github/workflows/build-merged-isolated-v2.yml"
      - "mergedisolatedv2/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore last merged source
        run: |
          cat mergedcovertoolbar/part00.txt mergedcovertoolbar/part01.txt mergedcovertoolbar/part02.txt mergedcovertoolbar/part03.txt mergedcovertoolbar/part04.txt > /tmp/merged-source.b64
          test "$(wc -c < /tmp/merged-source.b64)" = "44988"
          echo '8cac4a2fa515706964ad95c83bdbeec3fa4944b5a6042167890bea96d02eb4aa  /tmp/merged-source.b64' | sha256sum -c -
          base64 -d /tmp/merged-source.b64 > /tmp/merged-source.tar.xz
          echo '8912a97f4fdcf03ed2c7dfb5a8aa795988dced5abb7dea6dfb8192347981e64f  /tmp/merged-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/merged-source.tar.xz

      - name: Restore CoverRecents runtime code exactly and isolate toolbar
        run: |
          cat > merged_project/app/src/main/java/apps/ijp/coverrecents/CoverRecentsApp.java <<'EOF_COVERAPP'
package apps.ijp.coverrecents;

import android.app.Application;

import java.util.concurrent.CountDownLatch;

import apps.ijp.coverrecents.service.OriginalValues;

/**
 * Application state used by RecentsEngine.
 *
 * The commercial original exposes a StateFlow through its billing/config ViewModel.
 * RecentsEngine.a() waits up to five seconds for the first non-null user-Pro Boolean
 * from that state source and launches ConfigActivity only when the value is false. The
 * clone omits the commercial framework, so this state/monitor preserves the contract.
 */
public final class CoverRecentsApp extends Application {
    public volatile CountDownLatch essentialsLatch;

    private final Object userProMonitor = new Object();
    private volatile Boolean originalUserProState;

    @Override
    public void onCreate() {
        super.onCreate();

        // The original commercial flow is the same Boolean exposed as getIsUserProStatus().
        // Billing is intentionally absent in this clone, so default to entitled/pro=true.
        // Set the preference false only when reproducing the original non-Pro follow-up.
        setOriginalUserProState(
                getSharedPreferences(OriginalValues.PREFS, MODE_PRIVATE)
                        .getBoolean(OriginalValues.PREF_USER_PRO_STATUS, true));
    }

    public void setOriginalUserProState(Boolean state) {
        synchronized (userProMonitor) {
            originalUserProState = state;
            userProMonitor.notifyAll();
        }
    }

    /** Returns null on timeout, mirroring withTimeoutOrNull around the original StateFlow. */
    public Boolean awaitOriginalUserProState(long timeoutMs) throws InterruptedException {
        long deadline = System.currentTimeMillis() + timeoutMs;
        synchronized (userProMonitor) {
            while (originalUserProState == null) {
                long remaining = deadline - System.currentTimeMillis();
                if (remaining <= 0L) return null;
                userProMonitor.wait(remaining);
            }
            return originalUserProState;
        }
    }
}
EOF_COVERAPP
          cat > merged_project/app/src/main/java/apps/ijp/coverrecents/MainActivity.java <<'EOF_MAIN'
package apps.ijp.coverrecents;

import android.app.Activity;
import android.content.Intent;
import android.content.SharedPreferences;
import android.graphics.Color;
import android.os.Bundle;
import android.provider.Settings;
import android.view.Gravity;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.Switch;
import android.widget.TextView;

import apps.ijp.coverrecents.service.OriginalValues;

public final class MainActivity extends Activity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        SharedPreferences prefs = getSharedPreferences(OriginalValues.PREFS, MODE_PRIVATE);

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(dp(22), dp(26), dp(22), dp(26));
        root.setGravity(Gravity.CENTER_HORIZONTAL);
        root.setBackgroundColor(Color.rgb(250, 250, 250));

        TextView title = new TextView(this);
        title.setText("CoverScreen Recents — Original Core");
        title.setTextSize(22f);
        title.setTextColor(Color.BLACK);
        title.setPadding(0, 0, 0, dp(18));
        root.addView(title, matchWrap());

        TextView info = new TextView(this);
        info.setText("원본 APK의 RecentsEngine DEX 흐름과 같은 커버 화면 최근 앱 경로입니다.\n" +
                "접근성 서비스를 켠 뒤 커버 화면 하단에서 제스처를 사용하세요.");
        info.setTextSize(15f);
        info.setTextColor(Color.DKGRAY);
        info.setPadding(0, 0, 0, dp(22));
        root.addView(info, matchWrap());

        Switch spay = new Switch(this);
        spay.setText("Samsung Pay 호환 모드");
        spay.setTextSize(16f);
        spay.setChecked(prefs.getBoolean(OriginalValues.PREF_SPAY, false));
        spay.setOnCheckedChangeListener((buttonView, checked) ->
                prefs.edit().putBoolean(OriginalValues.PREF_SPAY, checked).apply());
        root.addView(spay, matchWrap());

        Button accessibility = new Button(this);
        accessibility.setText("접근성 설정 열기");
        accessibility.setOnClickListener(v ->
                startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
        root.addView(accessibility, matchWrap());

        setContentView(root);
    }

    private LinearLayout.LayoutParams matchWrap() {
        return new LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT,
                LinearLayout.LayoutParams.WRAP_CONTENT);
    }

    private int dp(int value) {
        return Math.round(value * getResources().getDisplayMetrics().density);
    }
}
EOF_MAIN

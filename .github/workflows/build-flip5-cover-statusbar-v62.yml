name: Build Flip5 Cover StatusBar v6.2

on:
  push:
    branches:
      - flip5-shizuku-helper-build
    paths:
      - 'tools/flip5_cover_statusbar_v62/**'
      - '.github/workflows/build-flip5-cover-statusbar-v62.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: tools/flip5_cover_statusbar_v62
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flip5CoverStatusBar-v6.2-FixedPosition-Sticky
          path: tools/flip5_cover_statusbar_v62/app/build/outputs/apk/release/*.apk

name: Build Hardware Keyboard Toolbar v14

on:
  workflow_dispatch:
  push:
    branches: [ "hw-keyboard-toolbar-final" ]
    paths:
      - ".github/workflows/build-v14.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore v13 project
        run: |
          cat v13b/part*.txt > toolbar-v13-project.tar.gz.b64
          base64 -d toolbar-v13-project.tar.gz.b64 > toolbar-v13-project.tar.gz
          mkdir -p android-toolbar-v14
          tar -xzf toolbar-v13-project.tar.gz -C android-toolbar-v14
      - name: Patch clipboard to fixed 4-column grid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android-toolbar-v14/app/src/main/java/com/bbq20kbd/toolbar/test/ToolbarService.java')
          s = p.read_text()
          s = s.replace('grid.setColumnCount(3);', 'grid.setColumnCount(4);', 1)
          old = '''        scroll.addView(grid);
          int rowCount = (history.size() + 2) / 3;
          int visibleRows = Math.min(2, Math.max(1, rowCount));
          int scrollHeight = dp(72 * visibleRows);
          content.addView(scroll, new LinearLayout.LayoutParams(-1, scrollHeight));
          showPanel(content, dp(32) + scrollHeight);
'''
          new = '''        int remainder = history.size() % 4;
          if (remainder != 0) {
              int emptySlots = 4 - remainder;
              for (int i = 0; i < emptySlots; i++) {
                  View spacer = new View(uiContext());
                  GridLayout.LayoutParams spacerLp = new GridLayout.LayoutParams();
                  spacerLp.width = 0;
                  spacerLp.height = dp(68);
                  spacerLp.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                  spacerLp.setMargins(dp(2), dp(2), dp(2), dp(2));
                  grid.addView(spacer, spacerLp);
              }
          }

          scroll.addView(grid);
          int rowCount = (history.size() + 3) / 4;
          int visibleRows = Math.min(2, Math.max(1, rowCount));
          int scrollHeight = dp(72 * visibleRows);
          content.addView(scroll, new LinearLayout.LayoutParams(-1, scrollHeight));
          showPanel(content, dp(32) + scrollHeight);
'''
          if old not in s:
              raise SystemExit('clipboard row-count block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          b = Path('android-toolbar-v14/app/build.gradle.kts')
          t = b.read_text()
          t = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 15', t, count=1)
          t = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "2.2"', t, count=1)
          b.write_text(t)
          PY
      - name: Build
        working-directory: android-toolbar-v14
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HardwareKeyboardToolbar-v14-Clipboard4Columns
          path: android-toolbar-v14/app/build/outputs/apk/debug/app-debug.apk
